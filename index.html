<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/needle-daw.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Needle DAW</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
        <!-- <script crossOrigin="anonymous" src="//unpkg.com/react-scan/dist/auto.global.js"></script> -->
        <script>
            (function () {
                try {
                    const saved = localStorage.getItem('needle-daw-theme');
                    const isDark = saved ? saved === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
                    const root = document.documentElement;

                    root.classList.toggle('dark', isDark);
                    root.classList.toggle('light', !isDark);
                } catch (e) {
                    console.error('Error applying theme in head script:', e);
                }
            })();
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
